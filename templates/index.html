<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flask + MongoDB | Submit Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f7fb; }
    .form-card { max-width: 650px; margin: 55px auto; border: 0; border-radius: 16px; }
  </style>
</head>
<body>
  <main class="container">
    <section class="card shadow-sm form-card">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-2">Contact Form</h1>
        <p class="text-secondary mb-4">Submit your details. The backend stores them in MongoDB Atlas.</p>

        {% if errors %}
          <div class="alert alert-danger" role="alert">
            <strong>Submission failed:</strong>
            <ul class="mb-0 mt-2">
              {% for error in errors %}<li>{{ error }}</li>{% endfor %}
            </ul>
          </div>
        {% endif %}

        <form action="{{ url_for('submit_form') }}" method="POST">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input class="form-control" id="name" name="name" type="text"
                   value="{{ form_data.name if form_data else '' }}" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input class="form-control" id="email" name="email" type="email"
                   value="{{ form_data.email if form_data else '' }}" required>
          </div>
          <div class="mb-4">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" name="message" rows="4" required>{{ form_data.message if form_data else '' }}</textarea>
          </div>
          <button class="btn btn-primary w-100" type="submit">Submit data</button>
        </form>

        <hr class="my-4">
        <p class="small text-secondary mb-1">Task 1 API endpoint:</p>
        <a href="{{ url_for('api_data') }}" target="_blank">Open /api JSON response</a>
      </div>
    </section>
  </main>
</body>
</html>
